# builds LiveLily's core and its headless runner with CMake on Linux, macOS and Windows, and runs the tests with CTest
# (see livelily/CMakeLists.txt and livelily/doc/stage3_inventory.md); the app itself still needs openFrameworks and is built locally (make wpyo)
# the test files are kept out of this repository, so here CTest finds no tests, and the workflow checks that LiveLily builds
# LiveLily-part (livelily_part/) is not built here
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # with Python embedded on Linux; macOS and Windows without it for now (see the plan's question of bundling Python)
          - os: ubuntu-24.04
            pyo: "ON"
          - os: macos-14
            pyo: "OFF"
          - os: windows-2022
            pyo: "OFF"
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    defaults:
      run:
        working-directory: livelily
    steps:
      - uses: actions/checkout@v4

      - name: Install the dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfluidsynth-dev libasound2-dev

      - name: Set up Python
        if: matrix.pyo == 'ON'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config fluid-synth

      - name: Cache the packages of vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-fluidsynth

      - name: Install the dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg-cache" | Out-Null
          vcpkg install fluidsynth:x64-windows

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            toolchain="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLIVELILY_PYO=${{ matrix.pyo }} $toolchain

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=ignore
