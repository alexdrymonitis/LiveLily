# builds LiveLily (the desktop app, its core and the headless runner) with CMake on Linux, macOS and Windows, and runs the tests with CTest
# (see CMakeLists.txt); JUCE is fetched by CMake (see doc/stage4_inventory.md)
# the test files are kept out of this repository, so here CTest finds no tests, and the workflow checks that LiveLily builds
# LiveLily-part has a repository of its own (github.com/alexdrymonitis/LiveLily-part)
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # with Python embedded on Linux; macOS and Windows without it for now (see the plan's question of bundling Python)
          - os: ubuntu-24.04
            pyo: "ON"
          - os: macos-latest
            pyo: "OFF"
          - os: windows-2022
            pyo: "OFF"
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7

      - name: Install the dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ALSA and JACK for JUCE's MIDI and audio, and what JUCE's graphics need (its helper juceaide, built when CMake configures, uses them)
          sudo apt-get install -y pkg-config libfluidsynth-dev libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Set up Python
        if: matrix.pyo == 'ON'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config fluid-synth

      - name: Cache the packages of vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-fluidsynth-zlib

      - name: Install the dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg-cache" | Out-Null
          # zlib for compressed MusicXML files (see musicxml.cpp), which Linux and macOS have already
          vcpkg install fluidsynth:x64-windows zlib:x64-windows

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Homebrew's packages (FluidSynth), also where CMake doesn't look by itself, and with the directories of Homebrew's prefix
            # which its pkg-config leaves out as system ones, though Apple's compiler and linker don't search them
            extra="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
            export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1 PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
            # FluidSynth requires readline, which Homebrew keeps out of pkg-config's path
            export PKG_CONFIG_PATH="$(brew --prefix readline)/lib/pkgconfig:$PKG_CONFIG_PATH"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLIVELILY_PYO=${{ matrix.pyo }} $extra

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=ignore
